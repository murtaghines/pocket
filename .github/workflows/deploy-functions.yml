name: Deploy Supabase Edge Functions

# Deploys every edge function in supabase/functions/ to the Supabase project when
# they change on main. Per-function `verify_jwt` is governed by supabase/config.toml
# (send-otp-code / verify-otp-code / check-email-availability are verify_jwt=false
# there; every other function defaults to verify_jwt=true), so a blanket deploy is safe.
#
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN
#   (Supabase dashboard -> Account -> Access Tokens -> generate).
# The project ref below is public and safe to commit.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ertwmshiupmickhfbaue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail early if access token is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
