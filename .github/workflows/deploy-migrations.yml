name: Apply Supabase Migrations

# Applies pending files from supabase/migrations/ to the production database whenever they
# change on main, so merging a PR is the only step needed to ship a schema change.
# scripts/sync-migrations.sh first reconciles the history table with the repo (a no-op once
# in sync), then runs `supabase db push`.
#
# Uses the same SUPABASE_ACCESS_TOKEN secret as deploy-functions.yml; the CLI mints a
# temporary database login from it, so no database password is needed. If you ever want to
# use a password instead, add a SUPABASE_DB_PASSWORD secret and it is picked up automatically.
# The project ref below is public and safe to commit.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/sync-migrations.sh"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would change"
        type: boolean
        default: false

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ertwmshiupmickhfbaue
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail early if access token is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Sync and apply migrations
        run: scripts/sync-migrations.sh
